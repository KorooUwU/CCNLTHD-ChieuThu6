name: Build and Test

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notification-dispatcher

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: notification_test
          POSTGRES_USER: notification_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notification_test -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_PORT: "5432"
      POSTGRES_DB: notification_test
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: ci_test_only

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: notification-dispatcher/pom.xml

      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
